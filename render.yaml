# Render Blueprint — VulnShop hosted classroom lab.
# Render dashboard -> New -> Blueprint -> choose this repository.
services:
  - type: web
    name: vulnshop-lab
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                      # free: data resets on every restart/redeploy (see docs/DEPLOY_RENDER.md)
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: JWT_SECRET             # generated by Render; also seeds the derived class code / instructor password
        generateValue: true
      # Optional. If not set, LAB_ACCESS_CODE and INSTRUCTOR_PASSWORD are derived from JWT_SECRET
      # and printed in the deploy log. PUBLIC_HOSTS: add your custom domain (onrender.com host is automatic).
      - key: LAB_ACCESS_CODE
        sync: false
      - key: INSTRUCTOR_PASSWORD
        sync: false
      - key: PUBLIC_HOSTS
        sync: false
